<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="VECANOVA AI Interview Prep — Neural Network and Interview Gates">
  <title>VECANOVA AI Interview Prep</title>
  <desc>A neural network node structure intersecting with technical interview gates and success checkmarks.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <rect width="640" height="400" fill="url(#bg)"/>

  <!-- Neural Network Connections -->
  <g stroke="#334155" stroke-width="2" fill="none">
    <path d="M 120 200 L 220 120 L 320 200 L 420 120 L 520 200"/>
    <path d="M 120 200 L 220 280 L 320 200 L 420 280 L 520 200"/>
    <path d="M 220 120 L 320 200 L 420 280"/>
    <path d="M 220 280 L 320 200 L 420 120"/>
  </g>

  <!-- Neural Nodes -->
  <circle cx="120" cy="200" r="16" fill="url(#nodeGrad)"/>
  <circle cx="220" cy="120" r="14" fill="url(#nodeGrad)"/>
  <circle cx="220" cy="280" r="14" fill="url(#nodeGrad)"/>
  <circle cx="320" cy="200" r="18" fill="url(#accentGrad)"/>
  <circle cx="420" cy="120" r="14" fill="url(#nodeGrad)"/>
  <circle cx="420" cy="280" r="14" fill="url(#nodeGrad)"/>
  <circle cx="520" cy="200" r="16" fill="url(#nodeGrad)"/>

  <!-- Success Checkmarks at Gates -->
  <g transform="translate(310, 190) scale(0.8)">
    <path d="M-2 5 L4 12 L18 -4" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Wordmark -->
  <text x="60" y="340" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="800"
        letter-spacing="2.0" fill="#ffffff">VECANOVA</text>
  <text x="270" y="340" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="300"
        letter-spacing="1.0" fill="#38bdf8">AI INTERVIEW PREP</text>
  <text x="60" y="370" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14"
        fill="#94a3b8">From Zero to Hero — Master Senior AI/ML Engineering across 5 Industries</text>
</svg>
